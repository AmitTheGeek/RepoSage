plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

def backendBaseUrl = providers.gradleProperty("reposage.backendUrl")
    .orElse("http://10.0.2.2:8000/")

android {
    namespace "com.reposage.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.reposage.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BACKEND_BASE_URL", "\"${backendBaseUrl.get()}\""
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.compose.ui:ui:1.7.3"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.3"
    implementation "androidx.compose.foundation:foundation:1.7.3"
    implementation "androidx.compose.foundation:foundation-layout:1.7.3"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    debugImplementation "androidx.compose.ui:ui-tooling:1.7.3"
}
